name: Build libmpv-android

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

jobs:
  build:
    name: Build (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only here, which made every tag build
    # fail at "Create release" with "Resource not accessible by integration".
    permissions:
      contents: write
    # Two AARs from one source tree: the regular one, and a legacy one for
    # Android 5.x devices (Fire OS 5 / discarded Fire TV hardware). A tag build
    # attaches both to the same release, so consumers pin one version string.
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            suffix: ""
          - api: 21
            suffix: "-legacy"
    env:
      MPV_API_LEVEL: ${{ matrix.api }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Symlink SDK
        working-directory: ./buildscripts
        run: |
          mkdir sdk
          ln -s ${ANDROID_HOME} ./sdk/android-sdk-linux
      - name: Download dependencies
        working-directory: ./buildscripts
        run: ./download.sh
      - name: Apply patches
        working-directory: ./buildscripts
        run: ./patch.sh
      - name: Build
        working-directory: ./buildscripts
        run: ./build.sh
      # Both matrix jobs emit the same path, so name the asset before it leaves
      # the runner — otherwise the two legs collide on the release.
      - name: Rename AAR
        run: mv ./libmpv/build/outputs/aar/libmpv-release.aar ./libmpv-release${{ matrix.suffix }}.aar
      - uses: actions/upload-artifact@v4
        with:
          name: libmpv-release${{ matrix.suffix }}.aar
          path: ./libmpv-release${{ matrix.suffix }}.aar
      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./libmpv-release${{ matrix.suffix }}.aar
